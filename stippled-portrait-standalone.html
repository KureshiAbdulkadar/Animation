<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stippled Particle Portrait — Pointillism Particle Assembly</title>
  <style>
/* Stippled Particle Portrait UI Styling */
:root {
  --bg-primary: #000000;
  --panel-bg: rgba(15, 17, 23, 0.75);
  --panel-border: rgba(255, 255, 255, 0.08);
  --accent: #ffffff;
  --accent-dim: rgba(255, 255, 255, 0.2);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color: var(--text-main);
}

#canvas-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000000;
}

/* Glassmorphic UI HUD */
.hud-panel {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 320px;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 20px;
  z-index: 100;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.hud-panel::-webkit-scrollbar {
  width: 4px;
}
.hud-panel::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

.hud-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 12px;
}

.hud-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #ffffff;
}

.hud-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.1);
  color: #cbd5e1;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
}

.control-val {
  color: #ffffff;
  font-weight: 500;
}

/* Mode Buttons */
.mode-pills {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.mode-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--panel-border);
  color: var(--text-muted);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: center;
}

.mode-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.mode-btn.active {
  background: #ffffff;
  color: #000000;
  border-color: #ffffff;
  font-weight: 600;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
}

/* Sliders */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 5px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #ffffff;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  transition: transform 0.1s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

/* Action Buttons */
.action-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--panel-border);
  color: #ffffff;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.action-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.3);
}

.action-btn.primary {
  background: #ffffff;
  color: #000000;
  font-weight: 600;
}

.action-btn.primary:hover {
  background: #e2e8f0;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
}

/* Upload Dropzone */
.upload-dropzone {
  border: 1px dashed rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
}

.upload-dropzone:hover, .upload-dropzone.dragover {
  border-color: #ffffff;
  background: rgba(255, 255, 255, 0.05);
  color: #ffffff;
}

/* Title Badge Top-Left */
.title-badge {
  position: absolute;
  top: 20px;
  left: 20px;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 12px 18px;
  z-index: 50;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}

.title-badge h1 {
  font-size: 15px;
  font-weight: 600;
  color: #ffffff;
}

.title-badge p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}

</style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top-Left Title Badge -->
  <div class="title-badge">
    <h1>Stippled Particle Portrait</h1>
    <p>Pointillism particle assembly &amp; luminance-weighted stippling</p>
  </div>

  <!-- Interactive Control HUD -->
  <div class="hud-panel">
    <div class="hud-header">
      <div class="hud-title">Portrait Controls</div>
      <div class="hud-badge" id="particle-counter">12,000 Dots</div>
    </div>

    <!-- Mode Selector -->
    <div class="control-group">
      <div class="control-label"><span>Animation State</span></div>
      <div class="mode-pills">
        <button class="mode-btn active" data-mode="assembling">Assemble</button>
        <button class="mode-btn" data-mode="static">Static</button>
        <button class="mode-btn" data-mode="scattered">Scatter</button>
        <button class="mode-btn" id="btn-reassemble">Replay</button>
      </div>
    </div>

    <!-- Particle Count -->
    <div class="control-group">
      <div class="control-label">
        <span>Particle Density</span>
        <span class="control-val" id="val-count">12,000</span>
      </div>
      <input type="range" id="slider-count" min="4000" max="24000" step="1000" value="12000">
    </div>

    <!-- Contrast & Threshold -->
    <div class="control-group">
      <div class="control-label">
        <span>Contrast &amp; Depth</span>
        <span class="control-val" id="val-contrast">1.3x</span>
      </div>
      <input type="range" id="slider-contrast" min="0.8" max="2.2" step="0.05" value="1.25">
    </div>

    <!-- Dot Size Scale -->
    <div class="control-group">
      <div class="control-label">
        <span>Max Dot Size</span>
        <span class="control-val" id="val-size">2.4px</span>
      </div>
      <input type="range" id="slider-size" min="1.0" max="4.5" step="0.1" value="2.4">
    </div>

    <!-- Spring Assembly Speed -->
    <div class="control-group">
      <div class="control-label">
        <span>Assembly Tension</span>
        <span class="control-val" id="val-tension">0.045</span>
      </div>
      <input type="range" id="slider-tension" min="0.01" max="0.1" step="0.005" value="0.045">
    </div>

    <!-- Custom Photo Upload Dropzone -->
    <div class="control-group">
      <div class="control-label"><span>Custom Portrait Photo</span></div>
      <div class="upload-dropzone" id="dropzone">
        <span id="dropzone-text">📷 Click or Drop Photo Here</span>
        <input type="file" id="file-input" accept="image/*" style="display:none">
      </div>
    </div>

    <!-- Action Buttons -->
    <button class="action-btn primary" id="btn-trigger-assemble">
      <span>✨ Assemble Portrait</span>
    </button>
  </div>

  <script>
    /**
 * StippledPortrait.js — High-Fidelity Stippled Particle Portrait Engine
 * 
 * Recreates photographic portraits in stippled pointillism style:
 * - Crisp white dots on pure black background
 * - Organic density distribution based on image luminance
 * - Preserves face shape, hairstyle, sunglasses, expression & proportions
 * - Smooth assemble & settle particle physics animation
 * - Interactive cursor repulsion & custom photo upload
 */

class StippledPortrait {
  constructor(container, options = {}) {
    this.container = typeof container === 'string' ? document.querySelector(container) : container;
    if (!this.container) throw new Error('Invalid container element');

    this.options = Object.assign({
      imageSrc: '/portrait.jpg',
      particleCount: 12000,
      dotMinSize: 0.8,
      dotMaxSize: 2.4,
      contrast: 1.25,
      brightnessCutoff: 0.08,
      gamma: 1.4,
      dotColor: '#ffffff',
      bgColor: '#000000',
      initialState: 'assembling', // 'static' | 'assembling' | 'scattered' | 'settled'
      springK: 0.045,             // Spring tension for assembly
      damping: 0.86,              // Damping factor for settling
      cursorRadius: 100,          // Repulsion radius on mouse hover
      cursorForce: 8.0,           // Repulsion force
      dprCap: 2
    }, options);

    this.canvas = document.createElement('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.canvas.style.display = 'block';
    this.canvas.style.width = '100%';
    this.canvas.style.height = '100%';
    this.container.appendChild(this.canvas);

    this.width = 0;
    this.height = 0;
    this.dpr = 1;

    this.image = new Image();
    this.imageLoaded = false;

    this.particles = [];
    this.state = this.options.initialState; // 'static' | 'assembling' | 'settled' | 'scattered'
    this.assembleProgress = 0;
    this.assembleStartTime = performance.now();

    this.mouse = {
      x: -1000,
      y: -1000,
      isHovering: false
    };

    this.isRunning = false;
    this.rafId = null;

    this.handleResize();
    this.bindEvents();
    this.loadImage(this.options.imageSrc);
  }

  loadImage(src) {
    this.imageLoaded = false;
    this.image.crossOrigin = 'anonymous';
    this.image.onload = () => {
      this.imageLoaded = true;
      this.processImageAndGenerateParticles();
      if (!this.isRunning) this.start();
    };
    this.image.onerror = () => {
      console.warn('Failed to load image at ' + src + ', generating procedural portrait fallback.');
      this.generateProceduralPortrait();
      this.imageLoaded = true;
      if (!this.isRunning) this.start();
    };
    this.image.src = src;
  }

  loadCustomImage(imageElement) {
    this.image = imageElement;
    this.imageLoaded = true;
    this.processImageAndGenerateParticles();
  }

  processImageAndGenerateParticles() {
    if (!this.imageLoaded || !this.width || !this.height) return;

    // 1. Create offscreen canvas to scale and sample image pixels
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    // Target portrait dimensions maintaining aspect ratio centered in canvas
    const imgAspect = (this.image.width || 1) / (this.image.height || 1);
    const canvasAspect = this.width / this.height;

    let drawW, drawH, drawX, drawY;
    const paddingFactor = 0.88;

    if (canvasAspect > imgAspect) {
      drawH = this.height * paddingFactor;
      drawW = drawH * imgAspect;
    } else {
      drawW = this.width * paddingFactor;
      drawH = drawW / imgAspect;
    }

    drawX = (this.width - drawW) * 0.5;
    drawY = (this.height - drawH) * 0.5;

    const sampleW = Math.min(600, Math.floor(drawW));
    const sampleH = Math.min(600, Math.floor(drawH));
    offCanvas.width = sampleW;
    offCanvas.height = sampleH;

    offCtx.fillStyle = '#000000';
    offCtx.fillRect(0, 0, sampleW, sampleH);
    offCtx.drawImage(this.image, 0, 0, sampleW, sampleH);

    const imgData = offCtx.getImageData(0, 0, sampleW, sampleH);
    const data = imgData.data;

    // 2. Build Luminance Map & Cumulative Density Map for Importance Sampling
    const totalPixels = sampleW * sampleH;
    const luminanceMap = new Float32Array(totalPixels);
    const cumulativeDist = new Float64Array(totalPixels);

    let sumWeight = 0;
    const gamma = this.options.gamma || 1.4;
    const contrast = this.options.contrast || 1.25;
    const cutoff = this.options.brightnessCutoff || 0.08;

    for (let i = 0; i < totalPixels; i++) {
      const idx = i * 4;
      const r = data[idx] / 255;
      const g = data[idx + 1] / 255;
      const b = data[idx + 2] / 255;

      // Perceptual grayscale luminance
      let lum = 0.299 * r + 0.587 * g + 0.114 * b;

      // Apply contrast curve & gamma
      lum = Math.pow(lum, gamma) * contrast;
      if (lum < cutoff) lum = 0; // Keep deep shadows pure black

      luminanceMap[i] = lum;
      sumWeight += lum;
      cumulativeDist[i] = sumWeight;
    }

    if (sumWeight === 0) sumWeight = 1;

    // 3. Stippling Generation: Sample particle targets according to density distribution
    const targetCount = this.options.particleCount || 12000;
    this.particles = [];

    const minSize = this.options.dotMinSize || 0.8;
    const maxSize = this.options.dotMaxSize || 2.4;

    for (let p = 0; p < targetCount; p++) {
      // Importance sampling via binary search on cumulative distribution
      const randVal = Math.random() * sumWeight;
      let low = 0, high = totalPixels - 1;
      let selectedIdx = 0;

      while (low <= high) {
        const mid = (low + high) >> 1;
        if (cumulativeDist[mid] >= randVal) {
          selectedIdx = mid;
          high = mid - 1;
        } else {
          low = mid + 1;
        }
      }

      const samplePy = Math.floor(selectedIdx / sampleW);
      const samplePx = selectedIdx % sampleW;

      // Add organic sub-pixel jitter
      const jitterX = (Math.random() - 0.5) * 1.8;
      const jitterY = (Math.random() - 0.5) * 1.8;

      const normX = (samplePx + jitterX) / sampleW;
      const normY = (samplePy + jitterY) / sampleH;

      const targetX = drawX + normX * drawW;
      const targetY = drawY + normY * drawH;

      const lum = Math.min(1.0, luminanceMap[selectedIdx]);

      // Organic dot size: larger in highlights, finer in midtones
      const dotSize = minSize + Math.pow(lum, 0.7) * (maxSize - minSize);
      const alpha = 0.4 + lum * 0.6; // Crisp high-contrast dots

      // Scattered start coordinates (scattered in a wide cloud)
      const angle = Math.random() * Math.PI * 2;
      const spread = Math.random() * Math.max(this.width, this.height) * 0.85;
      const startX = this.width * 0.5 + Math.cos(angle) * spread;
      const startY = this.height * 0.5 + Math.sin(angle) * spread;

      this.particles.push({
        // Target stipple portrait coordinate
        tx: targetX,
        ty: targetY,
        // Current position
        x: this.state === 'static' ? targetX : startX,
        y: this.state === 'static' ? targetY : startY,
        // Velocity for physics integration
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        size: dotSize,
        alpha: alpha,
        luminance: lum,
        settled: this.state === 'static'
      });
    }

    if (this.state === 'assembling') {
      this.assembleStartTime = performance.now();
    }
  }

  generateProceduralPortrait() {
    // Elegant procedural high-contrast stippled silhouette if image fails to fetch
    const cx = this.width * 0.5;
    const cy = this.height * 0.5;
    const targetCount = this.options.particleCount || 10000;
    this.particles = [];

    for (let i = 0; i < targetCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const px = cx + (u - 0.5) * 320;
      const py = cy + (v - 0.5) * 420;

      const distHead = Math.hypot((px - cx) / 130, (py - (cy - 30)) / 170);
      if (distHead > 1.0) continue;

      this.particles.push({
        tx: px,
        ty: py,
        x: px,
        y: py,
        vx: 0,
        vy: 0,
        size: 1.2 + Math.random() * 1.2,
        alpha: 0.9,
        luminance: 0.8,
        settled: true
      });
    }
  }

  handleResize() {
    const rect = this.container.getBoundingClientRect();
    this.width = rect.width || window.innerWidth;
    this.height = rect.height || window.innerHeight;
    this.dpr = Math.min(this.options.dprCap, window.devicePixelRatio || 1);
    this.canvas.width = Math.floor(this.width * this.dpr);
    this.canvas.height = Math.floor(this.height * this.dpr);

    if (this.imageLoaded) {
      this.processImageAndGenerateParticles();
    }
  }

  bindEvents() {
    this._resizeHandler = () => this.handleResize();
    window.addEventListener('resize', this._resizeHandler);

    const onMove = (clientX, clientY) => {
      const rect = this.canvas.getBoundingClientRect();
      this.mouse.x = clientX - rect.left;
      this.mouse.y = clientY - rect.top;
      this.mouse.isHovering = true;
    };

    const onLeave = () => {
      this.mouse.isHovering = false;
      this.mouse.x = -1000;
      this.mouse.y = -1000;
    };

    this.canvas.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
    this.canvas.addEventListener('mouseleave', onLeave);

    this.canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        onMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    this.canvas.addEventListener('touchend', onLeave);
  }

  triggerAssemble() {
    this.state = 'assembling';
    this.assembleStartTime = performance.now();

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      const angle = Math.random() * Math.PI * 2;
      const spread = (Math.random() * 0.7 + 0.3) * Math.max(this.width, this.height) * 0.75;
      p.x = this.width * 0.5 + Math.cos(angle) * spread;
      p.y = this.height * 0.5 + Math.sin(angle) * spread;
      p.vx = (Math.random() - 0.5) * 8;
      p.vy = (Math.random() - 0.5) * 8;
      p.settled = false;
    }
  }

  triggerScatter() {
    this.state = 'scattered';
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 8;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
      p.settled = false;
    }
  }

  setStatic() {
    this.state = 'static';
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      p.x = p.tx;
      p.y = p.ty;
      p.vx = 0;
      p.vy = 0;
      p.settled = true;
    }
  }

  setOptions(newOpts) {
    Object.assign(this.options, newOpts);
    if ('particleCount' in newOpts || 'contrast' in newOpts || 'gamma' in newOpts || 'brightnessCutoff' in newOpts) {
      this.processImageAndGenerateParticles();
    }
  }

  start() {
    if (this.isRunning) return;
    this.isRunning = true;

    const loop = () => {
      if (!this.isRunning) return;
      this.update();
      this.render();
      this.rafId = requestAnimationFrame(loop);
    };
    this.rafId = requestAnimationFrame(loop);
  }

  stop() {
    this.isRunning = false;
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
  }

  update() {
    if (!this.particles.length) return;

    const springK = this.options.springK || 0.045;
    const damping = this.options.damping || 0.86;
    const mouseRadius = this.options.cursorRadius || 100;
    const mouseForce = this.options.cursorForce || 8.0;
    const isHover = this.mouse.isHovering;
    const mx = this.mouse.x;
    const my = this.mouse.y;

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];

      if (this.state === 'static') {
        p.x = p.tx;
        p.y = p.ty;
        continue;
      }

      if (this.state === 'scattered') {
        // Floating gentle drift
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        continue;
      }

      // 'assembling' or 'settled'
      // 1. Spring force towards target portrait position
      const dx = p.tx - p.x;
      const dy = p.ty - p.y;
      const distToTarget = Math.hypot(dx, dy);

      const ax = dx * springK;
      const ay = dy * springK;

      p.vx = (p.vx + ax) * damping;
      p.vy = (p.vy + ay) * damping;

      // 2. Interactive Cursor Repulsion (disperse and bounce back)
      if (isHover) {
        const cdx = p.x - mx;
        const cdy = p.y - my;
        const cdist = Math.hypot(cdx, cdy);

        if (cdist < mouseRadius && cdist > 0.01) {
          const force = (1.0 - cdist / mouseRadius) * mouseForce;
          p.vx += (cdx / cdist) * force;
          p.vy += (cdy / cdist) * force;
        }
      }

      p.x += p.vx;
      p.y += p.vy;

      if (distToTarget < 0.2 && Math.hypot(p.vx, p.vy) < 0.1) {
        p.settled = true;
      }
    }
  }

  render() {
    const ctx = this.ctx;
    ctx.save();
    ctx.scale(this.dpr, this.dpr);

    // Pure black background
    ctx.fillStyle = this.options.bgColor || '#000000';
    ctx.fillRect(0, 0, this.width, this.height);

    if (!this.particles.length) {
      ctx.restore();
      return;
    }

    // High-performance batched dot rendering
    ctx.fillStyle = this.options.dotColor || '#ffffff';

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];

      // Cull offscreen particles
      if (p.x < -20 || p.x > this.width + 20 || p.y < -20 || p.y > this.height + 20) continue;

      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1.0;
    ctx.restore();
  }

  destroy() {
    this.stop();
    if (this._resizeHandler) {
      window.removeEventListener('resize', this._resizeHandler);
    }
    if (this.canvas && this.canvas.parentNode) {

      particleCount: 12000,
      initialState: 'assembling'
    });

    // UI Elements
    const modeBtns = document.querySelectorAll('.mode-btn[data-mode]');
    const btnReassemble = document.getElementById('btn-reassemble');
    const btnTriggerAssemble = document.getElementById('btn-trigger-assemble');
    const sliderCount = document.getElementById('slider-count');
    const valCount = document.getElementById('val-count');
    const sliderContrast = document.getElementById('slider-contrast');
    const valContrast = document.getElementById('val-contrast');
    const sliderSize = document.getElementById('slider-size');
    const valSize = document.getElementById('val-size');
    const sliderTension = document.getElementById('slider-tension');
    const valTension = document.getElementById('val-tension');
    const particleCounter = document.getElementById('particle-counter');

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.mode;
        if (mode === 'static') portrait.setStatic();
        else if (mode === 'assembling') portrait.triggerAssemble();
        else if (mode === 'scattered') portrait.triggerScatter();
      });
    });

    const triggerReplay = () => {
      portrait.triggerAssemble();
      modeBtns.forEach(b => {
        if (b.dataset.mode === 'assembling') b.classList.add('active');
        else b.classList.remove('active');
      });
    };

    btnReassemble.addEventListener('click', triggerReplay);
    btnTriggerAssemble.addEventListener('click', triggerReplay);

    sliderCount.addEventListener('input', (e) => {
      const count = parseInt(e.target.value);
      valCount.textContent = count.toLocaleString();
      particleCounter.textContent = count.toLocaleString() + ' Dots';
      portrait.setOptions({ particleCount: count });
    });

    sliderContrast.addEventListener('input', (e) => {
      const c = parseFloat(e.target.value);
      valContrast.textContent = c.toFixed(2) + 'x';
      portrait.setOptions({ contrast: c });
    });

    sliderSize.addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      valSize.textContent = s.toFixed(1) + 'px';
      portrait.setOptions({ dotMaxSize: s });
    });

    sliderTension.addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      valTension.textContent = t.toFixed(3);
      portrait.setOptions({ springK: t });
    });

    // File Upload / Drop
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const dropzoneText = document.getElementById('dropzone-text');

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        loadCustomFile(e.target.files[0]);
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        loadCustomFile(e.dataTransfer.files[0]);
      }
    });

    function loadCustomFile(file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          portrait.loadCustomImage(img);
          dropzoneText.textContent = '✓ ' + file.name.substring(0, 18);
          triggerReplay();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
