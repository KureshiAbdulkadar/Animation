<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cloth Wave Grid — Flowing Silk Particle Surface</title>
  <meta name="description" content="A 60+ FPS 3D particle grid flowing like silk cloth with surface normal specular sheen, multi-harmonic wave modes, and peak bloom depth shading.">
  <link rel="stylesheet" href="./effects/cloth-wave/styles.css">
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Brand / Title -->
  <header class="top-header">
    <div class="brand-icon">3D</div>
    <div class="title-group">
      <h1>3D Cloth Wave Grid</h1>
      <span class="subtitle">Silky Flowing Surface · Specular Slope Sheen &amp; Peak Bloom</span>
    </div>
  </header>

  <!-- Top Actions -->
  <nav class="top-actions">
    <a href="./index.html" class="action-btn">← All Presets</a>
    <a href="./pixel-wall.html" class="action-btn">2D Pixel Wall</a>
    <button id="btn-toggle-hud" class="action-btn" title="Toggle HUD Controls (H)">HUD: ON</button>
    <button id="btn-export-code" class="action-btn accent">Export HTML</button>
  </nav>

  <!-- Interactive HUD Controls -->
  <aside class="hud-panel" id="hud-panel">
    <div class="hud-header">
      <h2>Cloth Wave Config</h2>
    </div>

    <!-- Motion Mode -->
    <div class="control-group">
      <label>Wave Flow Pattern</label>
      <div class="mode-grid">
        <button class="mode-pill active" data-mode="silk">Silk Flow</button>
        <button class="mode-pill" data-mode="ocean">Ocean Swell</button>
        <button class="mode-pill" data-mode="ripple">Matrix Ripple</button>
        <button class="mode-pill" data-mode="vortex">Cosmic Vortex</button>
      </div>
    </div>

    <!-- Theme Selection -->
    <div class="control-group">
      <label>Color Theme</label>
      <div class="theme-grid">
        <button class="theme-pill active" data-theme="cyan">Cyan Silk</button>
        <button class="theme-pill" data-theme="emerald">Emerald Sea</button>
        <button class="theme-pill" data-theme="amber">Amber Glow</button>
        <button class="theme-pill" data-theme="violet">Neon Violet</button>
        <button class="theme-pill" data-theme="silver">Silver Monolith</button>
        <button class="theme-pill" data-theme="crimson">Crimson Velvet</button>
        <button class="theme-pill" data-theme="sunset">Cyber Sunset</button>
      </div>
    </div>

    <!-- Wave Amplitude -->
    <div class="control-group">
      <label for="slider-amp">Wave Height (Amplitude) <span class="val" id="val-amp">65px</span></label>
      <input type="range" id="slider-amp" min="20" max="140" value="65" step="1">
    </div>

    <!-- Wave Speed -->
    <div class="control-group">
      <label for="slider-speed">Wave Flow Speed <span class="val" id="val-speed">0.85x</span></label>
      <input type="range" id="slider-speed" min="0.2" max="2.5" value="0.85" step="0.05">
    </div>

    <!-- Grid Density (Cols x Rows) -->
    <div class="control-group">
      <label for="slider-density">Grid Density <span class="val" id="val-density">64 x 38</span></label>
      <input type="range" id="slider-density" min="32" max="80" value="64" step="2">
    </div>

    <!-- Camera Tilt Angle -->
    <div class="control-group">
      <label for="slider-pitch">Camera Tilt Angle <span class="val" id="val-pitch">28°</span></label>
      <input type="range" id="slider-pitch" min="15" max="60" value="28" step="1">
    </div>

    <!-- Peak Dot Size -->
    <div class="control-group">
      <label for="slider-peak-dot">Peak Dot Size <span class="val" id="val-peak-dot">3.4px</span></label>
      <input type="range" id="slider-peak-dot" min="1.5" max="6.0" value="3.4" step="0.1">
    </div>

    <!-- Valley Dot Size -->
    <div class="control-group">
      <label for="slider-valley-dot">Valley Dot Size <span class="val" id="val-valley-dot">1.2px</span></label>
      <input type="range" id="slider-valley-dot" min="0.4" max="2.5" value="1.2" step="0.1">
    </div>

    <!-- Peak Glow Bloom Intensity -->
    <div class="control-group">
      <label for="slider-glow">Peak Bloom Glow <span class="val" id="val-glow">1.0x</span></label>
      <input type="range" id="slider-glow" min="0.0" max="2.0" value="1.0" step="0.1">
    </div>

    <!-- Toggles -->
    <div class="toggle-row">
      <span>Cloth Mesh Lattice</span>
      <label class="switch">
        <input type="checkbox" id="toggle-mesh" checked>
        <span class="slider-round"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Specular Silk Sheen</span>
      <label class="switch">
        <input type="checkbox" id="toggle-specular" checked>
        <span class="slider-round"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Peak Glow Bloom</span>
      <label class="switch">
        <input type="checkbox" id="toggle-glow" checked>
        <span class="slider-round"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Horizon Depth Fog</span>
      <label class="switch">
        <input type="checkbox" id="toggle-fog" checked>
        <span class="slider-round"></span>
      </label>
    </div>
  </aside>

  <!-- Bottom Info Badge -->
  <div class="info-badge">
    <div class="fps-dot"></div>
    <span id="fps-counter">60 FPS</span>
    <span>·</span>
    <span id="dot-count">2,432 Dots</span>
    <span>·</span>
    <span id="mode-indicator">Silk Flow</span>
  </div>

  <script type="module">
    import { ClothWave, THEMES } from './effects/cloth-wave/ClothWave.js';

    const container = document.getElementById('canvas-container');
    const engine = new ClothWave(container, {
      cols: 64,
      rows: 38,
      spacingX: 28,
      spacingZ: 22,
      waveAmplitude: 65,
      waveSpeed: 0.85,
      peakDotRadius: 3.4,
      baseDotRadius: 1.2,
      cameraPitch: (28 * Math.PI) / 180,
      motionMode: 'silk',
      showMeshLines: true,
      showSpecular: true,
      showGlow: true,
      glowIntensity: 1.0,
      enableDepthFog: true
    });

    // Stats Monitor (FPS + Dot Count)
    let frameTimes = [];
    const fpsCounter = document.getElementById('fps-counter');
    const dotCounter = document.getElementById('dot-count');
    const modeIndicator = document.getElementById('mode-indicator');

    function updateStats(timestamp) {
      while (frameTimes.length > 0 && frameTimes[0] <= timestamp - 1000) {
        frameTimes.shift();
      }
      frameTimes.push(timestamp);
      if (fpsCounter && frameTimes.length > 1) {
        fpsCounter.textContent = `${frameTimes.length} FPS`;
      }
      if (dotCounter) {
        dotCounter.textContent = `${engine.particles.length.toLocaleString()} Dots`;
      }
      requestAnimationFrame(updateStats);
    }
    requestAnimationFrame(updateStats);

    // Wave Mode Selector
    const modePills = document.querySelectorAll('.mode-pill');
    modePills.forEach(pill => {
      pill.addEventListener('click', () => {
        modePills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const mode = pill.getAttribute('data-mode');
        engine.setOptions({ motionMode: mode });
        if (modeIndicator) {
          modeIndicator.textContent = pill.textContent;
        }
      });
    });

    // Theme selector
    const themePills = document.querySelectorAll('.theme-pill');
    themePills.forEach(pill => {
      pill.addEventListener('click', () => {
        themePills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const themeKey = pill.getAttribute('data-theme');
        if (THEMES[themeKey]) {
          engine.setTheme(themeKey);
        }
      });
    });

    // Range sliders
    function bindSlider(id, valId, unit, optKey, parseFn = parseFloat) {
      const slider = document.getElementById(id);
      const val = document.getElementById(valId);
      if (!slider || !val) return;
      slider.addEventListener('input', (e) => {
        const parsed = parseFn(e.target.value);
        val.textContent = `${parsed}${unit}`;
        engine.setOptions({ [optKey]: parsed });
      });
    }

    bindSlider('slider-amp', 'val-amp', 'px', 'waveAmplitude');
    bindSlider('slider-speed', 'val-speed', 'x', 'waveSpeed');
    bindSlider('slider-peak-dot', 'val-peak-dot', 'px', 'peakDotRadius');
    bindSlider('slider-valley-dot', 'val-valley-dot', 'px', 'baseDotRadius');
    bindSlider('slider-glow', 'val-glow', 'x', 'glowIntensity');

    const densitySlider = document.getElementById('slider-density');
    const densityVal = document.getElementById('val-density');
    densitySlider.addEventListener('input', (e) => {
      const cols = parseInt(e.target.value, 10);
      const rows = Math.round(cols * (38 / 64));
      densityVal.textContent = `${cols} x ${rows}`;
      engine.setOptions({ cols, rows });
    });

    const pitchSlider = document.getElementById('slider-pitch');
    const pitchVal = document.getElementById('val-pitch');
    pitchSlider.addEventListener('input', (e) => {
      const deg = parseInt(e.target.value, 10);
      pitchVal.textContent = `${deg}°`;
      engine.setOptions({ cameraPitch: (deg * Math.PI) / 180 });
    });

    // Feature Toggles
    document.getElementById('toggle-mesh').addEventListener('change', (e) => {
      engine.setOptions({ showMeshLines: e.target.checked });
    });
    document.getElementById('toggle-specular').addEventListener('change', (e) => {
      engine.setOptions({ showSpecular: e.target.checked });
    });
    document.getElementById('toggle-glow').addEventListener('change', (e) => {
      engine.setOptions({ showGlow: e.target.checked });
    });
    document.getElementById('toggle-fog').addEventListener('change', (e) => {
      engine.setOptions({ enableDepthFog: e.target.checked });
    });

    // HUD Toggle
    const hudPanel = document.getElementById('hud-panel');
    const btnToggleHud = document.getElementById('btn-toggle-hud');
    function toggleHud() {
      hudPanel.classList.toggle('hidden');
      const isHidden = hudPanel.classList.contains('hidden');
      btnToggleHud.textContent = isHidden ? 'HUD: OFF' : 'HUD: ON';
    }
    btnToggleHud.addEventListener('click', toggleHud);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') toggleHud();
    });

    // Export HTML
    document.getElementById('btn-export-code').addEventListener('click', () => {
      window.open('./cloth-wave-standalone.html', '_blank');
    });
  </script>
</body>
</html>
