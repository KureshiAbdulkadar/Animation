<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Dot Globe (World Map) — Standalone Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #030704;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: grab;
    }
    body:active { cursor: grabbing; }

    #c {
      display: block; width: 100%; height: 100%;
      position: absolute; inset: 0; z-index: 1;
    }

    .h { position: fixed; z-index: 10; pointer-events: none; }

    .tl {
      top: 20px; left: 24px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .tl h1 {
      font-size: 13px; font-weight: 600; margin: 0;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.5px; text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }
    .tl p {
      font-size: 11px; font-weight: 400; margin: 0;
      color: rgba(255,255,255,0.45); letter-spacing: 0.3px;
    }

    .tr {
      top: 20px; right: 24px;
      pointer-events: auto;
      display: flex; align-items: center; gap: 8px;
    }

    .palette-btn {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer; transition: transform 0.15s ease;
    }
    .palette-btn:hover { transform: scale(1.2); border-color: #fff; }

    .code-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.85);
      cursor: pointer; transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    .code-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.25);
      color: #fff;
      transform: translateY(-1px);
    }

    .br {
      bottom: 16px; right: 20px;
      display: flex; align-items: center; gap: 10px;
    }

    .p {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 10px; font-weight: 500;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.4px; text-transform: uppercase;
    }
    .p .d {
      width: 6px; height: 6px; border-radius: 50%;
      background: #f07c00; box-shadow: 0 0 6px #f07c0080;
    }

    .bl { bottom: 16px; left: 24px; }
    .cb {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 10px; font-weight: 500;
      color: rgba(255,255,255,0.50); letter-spacing: 0.3px;
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
    }
    .cs {
      width: 10px; height: 10px; border-radius: 3px;
      background: #f07c00; border: 1px solid rgba(255,255,255,0.15);
    }

    /* Code Reader Drawer */
    .drawer {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      display: none; justify-content: flex-end;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .drawer.open { display: flex; opacity: 1; }
    .drawer-panel {
      width: 640px; max-width: 92vw; height: 100%;
      background: rgba(10, 14, 22, 0.96);
      border-left: 1px solid rgba(255,255,255,0.12);
      display: flex; flex-direction: column;
      box-shadow: -10px 0 40px rgba(0,0,0,0.8);
      transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drawer.open .drawer-panel { transform: translateX(0); }
    .drawer-header {
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-title { font-size: 13px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .drawer-actions { display: flex; align-items: center; gap: 8px; }
    .btn-sm {
      padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.08);
      color: #e2e8f0; transition: all 0.15s ease;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.16); color: #fff; }
    .btn-close {
      background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px;
    }
    .btn-close:hover { color: #fff; }
    .drawer-body {
      flex: 1; overflow: auto; padding: 20px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.55;
      color: #94a3b8; background: #060910; white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="h tl">
    <h1>3D Dot Globe (World Map)</h1>
    <p>Authentic Continents Simulation · Drag to Rotate</p>
  </div>
  <div class="h tr">
    <button type="button" class="palette-btn" data-color="#f07c00" style="background:#f07c00;" title="Amber"></button>
    <button type="button" class="palette-btn" data-color="#00f0ff" style="background:#00f0ff;" title="Cyan"></button>
    <button type="button" class="palette-btn" data-color="#10b981" style="background:#10b981;" title="Emerald"></button>
    <button type="button" class="palette-btn" data-color="#d000ff" style="background:#d000ff;" title="Purple"></button>
    <button type="button" class="code-btn" id="btn-toggle-code">〈/〉 View HTML</button>
  </div>
  <div class="h bl"><div class="cb"><span class="cs" id="swatch"></span><span id="color-name">#F07C00</span></div></div>
  <div class="h br"><div class="p"><span class="d" id="dot-ind"></span><span id="f">-- FPS</span></div><div class="p">CANVAS 2D</div></div>

  <!-- Slide-out Drawer to Read & Copy HTML Code -->
  <div class="drawer" id="code-drawer">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div class="drawer-title">3D Dot Globe — HTML Code</div>
        <div class="drawer-actions">
          <button type="button" class="btn-sm" id="btn-copy-code">Copy HTML</button>
          <button type="button" class="btn-close" id="btn-close-code">✕</button>
        </div>
      </div>
      <pre class="drawer-body" id="code-content"></pre>
    </div>
  </div>

  <script>
    "use strict";

    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, raf = 0;

    var color = "#f07c00";
    var speed = 1.0;
    var baseR = 240, baseG = 124, baseB = 0;

    function setAccentColor(hex) {
      color = hex;
      var clean = hex.replace("#", "");
      baseR = parseInt(clean.substring(0, 2), 16) || 240;
      baseG = parseInt(clean.substring(2, 4), 16) || 124;
      baseB = parseInt(clean.substring(4, 6), 16) || 0;
      document.getElementById("swatch").style.background = hex;
      document.getElementById("color-name").textContent = hex.toUpperCase();
      document.getElementById("dot-ind").style.background = hex;
      document.getElementById("dot-ind").style.boxShadow = "0 0 6px " + hex + "80";
    }

    var width, height;
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      width = W; height = H;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = (W * dpr) | 0;
      canvas.height = (H * dpr) | 0;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // ── 3D Dot Globe Landmass Detection Matrix & Projection Cache ──
    var isLand = function(lat, lon) {
      if (lat > 48 && lat < 72 && lon > -140 && lon < -55) return true;
      if (lat > 25 && lat < 50 && lon > -125 && lon < -65) {
        if (lat > 25 && lat < 35 && lon < -100) return true;
        if (lat > 30 && lon > -105) return true;
        if (lat > 40) return true;
        return false;
      }
      if (lat > 15 && lat < 32 && lon > -117 && lon < -85) return true;
      if (lat > 7 && lat < 18 && lon > -92 && lon < -77) return true;
      if (lat > 55 && lat < 72 && lon > -170 && lon < -140) return true;
      if (lat > 60 && lat < 83 && lon > -55 && lon < -18) return true;
      if (lat > -5 && lat < 13 && lon > -82 && lon < -48) return true;
      if (lat > -23 && lat < -5 && lon > -78 && lon < -35) return true;
      if (lat > -40 && lat < -23 && lon > -72 && lon < -38) return true;
      if (lat > -55 && lat < -40 && lon > -75 && lon < -63) return true;
      if (lat > 36 && lat < 46 && lon > -10 && lon < 28) return true;
      if (lat > 46 && lat < 55 && lon > -5 && lon < 25) return true;
      if (lat > 55 && lat < 65 && lon > 5 && lon < 32) return true;
      if (lat > 50 && lat < 60 && lon > -10 && lon < 3) return true;
      if (lat > 65 && lat < 71 && lon > 12 && lon < 30) return true;
      if (lat > 20 && lat < 37 && lon > -17 && lon < 40) return true;
      if (lat > 4 && lat < 20 && lon > -17 && lon < 45) return true;
      if (lat > -5 && lat < 4 && lon > 8 && lon < 42) return true;
      if (lat > -18 && lat < -5 && lon > 12 && lon < 42) return true;
      if (lat > -35 && lat < -18 && lon > 16 && lon < 36) return true;
      if (lat > -25 && lat < -12 && lon > 43 && lon < 50) return true;
      if (lat > 12 && lat < 37 && lon > 35 && lon < 60) return true;
      if (lat > 50 && lat < 75 && lon > 30 && lon < 180) return true;
      if (lat > 45 && lat < 50 && lon > 40 && lon < 145) return true;
      if (lat > 8 && lat < 28 && lon > 68 && lon < 88) return true;
      if (lat > 28 && lat < 35 && lon > 70 && lon < 80) return true;
      if (lat > 22 && lat < 42 && lon > 98 && lon < 125) return true;
      if (lat > 42 && lat < 53 && lon > 80 && lon < 130) return true;
      if (lat > 18 && lat < 22 && lon > 100 && lon < 112) return true;
      if (lat > 0 && lat < 20 && lon > 96 && lon < 110) return true;
      if (lat > 30 && lat < 45 && lon > 129 && lon < 146) return true;
      if (lat > 34 && lat < 42 && lon > 125 && lon < 130) return true;
      if (lat > -8 && lat < 6 && lon > 95 && lon < 140) return true;
      if (lat > 5 && lat < 18 && lon > 118 && lon < 127) return true;
      if (lat > -38 && lat < -12 && lon > 115 && lon < 152) return true;
      if (lat > -47 && lat < -34 && lon > 166 && lon < 178) return true;
      if (lat > 6 && lat < 10 && lon > 79 && lon < 82) return true;
      if (lat > 63 && lat < 66 && lon > -24 && lon < -14) return true;
      return false;
    };

    var globePoints = [];
    var globeRotY = 0;
    var globeRotX = 0.35;
    var globeDragging = false;
    var globeDragLastX = 0;
    var globeDragLastY = 0;

    function initGlobePoints() {
      globePoints = [];
      var step = 2.8;
      for (var lat = -85; lat <= 85; lat += step) {
        var latRad = lat * Math.PI / 180;
        var lonCount = Math.max(6, Math.floor(128 * Math.cos(latRad)));
        var lonStep = 360 / lonCount;
        for (var i = 0; i < lonCount; i++) {
          var lon = -180 + i * lonStep;
          var lonRad = lon * Math.PI / 180;
          globePoints.push({
            x: Math.cos(latRad) * Math.cos(lonRad),
            y: Math.sin(latRad),
            z: Math.cos(latRad) * Math.sin(lonRad),
            land: isLand(lat, lon)
          });
        }
      }
    }
    initGlobePoints();

    // Mouse & Touch Drag Rotation
    canvas.addEventListener("mousedown", function(e) {
      globeDragging = true;
      globeDragLastX = e.clientX;
      globeDragLastY = e.clientY;
    });
    window.addEventListener("mousemove", function(e) {
      if (globeDragging) {
        var dx = e.clientX - globeDragLastX;
        var dy = e.clientY - globeDragLastY;
        globeRotY += dx * 0.005;
        globeRotX += dy * 0.005;
        globeRotX = Math.max(-1.3, Math.min(1.3, globeRotX));
        globeDragLastX = e.clientX;
        globeDragLastY = e.clientY;
      }
    });
    window.addEventListener("mouseup", function() {
      globeDragging = false;
    });
    canvas.addEventListener("touchstart", function(e) {
      if (e.touches.length > 0) {
        globeDragging = true;
        globeDragLastX = e.touches[0].clientX;
        globeDragLastY = e.touches[0].clientY;
      }
    }, { passive: true });
    window.addEventListener("touchmove", function(e) {
      if (globeDragging && e.touches.length > 0) {
        var dx = e.touches[0].clientX - globeDragLastX;
        var dy = e.touches[0].clientY - globeDragLastY;
        globeRotY += dx * 0.005;
        globeRotX += dy * 0.005;
        globeRotX = Math.max(-1.3, Math.min(1.3, globeRotX));
        globeDragLastX = e.touches[0].clientX;
        globeDragLastY = e.touches[0].clientY;
      }
    }, { passive: true });
    window.addEventListener("touchend", function() {
      globeDragging = false;
    });

    // FPS
    var fc = 0, ft = performance.now(), fEl = document.getElementById("f");

    function draw() {
      fc++;
      var now = performance.now();
      if (now - ft >= 1000) { fEl.textContent = fc + " FPS"; fc = 0; ft = now; }

      width = W; height = H;
      ctx.fillStyle = "#030704";
      ctx.fillRect(0, 0, W, H);

      // 05. 3D Dot Globe (Faithful World Map Simulation)
      if (!globeDragging) globeRotY += 0.0018 * speed;

      var gcx = width / 2;
      var gcy = height / 2;
      var gRadius = Math.min(width, height) * 0.38;

      var cosRX = Math.cos(globeRotX);
      var sinRX = Math.sin(globeRotX);
      var cosRY = Math.cos(globeRotY);
      var sinRY = Math.sin(globeRotY);

      var projected = [];
      for (var i = 0; i < globePoints.length; i++) {
        var p = globePoints[i];
        var rx = p.x * cosRY + p.z * sinRY;
        var ry = p.y;
        var rz = -p.x * sinRY + p.z * cosRY;
        var fx = rx;
        var fy = ry * cosRX - rz * sinRX;
        var fz = ry * sinRX + rz * cosRX;

        if (fz < -0.15) continue; // back-face cull

        var depth = (fz + 1) / 2;
        projected.push({
          sx: gcx + fx * gRadius,
          sy: gcy - fy * gRadius,
          depth: depth,
          land: p.land
        });
      }

      projected.sort(function(a, b) { return a.depth - b.depth; });

      for (var j = 0; j < projected.length; j++) {
        var pt = projected[j];
        var sz = 0.6 + pt.depth * 2.2;
        var br;
        if (pt.land) {
          br = 55 + pt.depth * 200;
          var r = Math.min(255, Math.floor(baseR * (br / 255)));
          var g = Math.min(255, Math.floor(baseG * (br / 255)));
          var b = Math.min(255, Math.floor(baseB * (br / 255)));
          ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        } else {
          br = 10 + pt.depth * 35;
          ctx.fillStyle = "rgb(" + Math.floor(br) + "," + Math.floor(br) + "," + Math.floor(br + 5) + ")";
        }
        ctx.beginPath();
        ctx.arc(pt.sx, pt.sy, sz, 0, Math.PI * 2);
        ctx.fill();
      }

      raf = requestAnimationFrame(draw);
    }

    raf = requestAnimationFrame(draw);

    // Palette click
    document.querySelectorAll(".palette-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        setAccentColor(btn.getAttribute("data-color"));
      });
    });

    // Drawer
    (function() {
      var drawer = document.getElementById("code-drawer");
      var toggleBtn = document.getElementById("btn-toggle-code");
      var closeBtn = document.getElementById("btn-close-code");
      var copyBtn = document.getElementById("btn-copy-code");
      var codePre = document.getElementById("code-content");

      function openDrawer() {
        if (!codePre.textContent) {
          codePre.textContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        }
        drawer.classList.add("open");
      }
      function closeDrawer() {
        drawer.classList.remove("open");
      }

      if (toggleBtn) toggleBtn.addEventListener("click", openDrawer);
      if (closeBtn) closeBtn.addEventListener("click", closeDrawer);
      if (drawer) drawer.addEventListener("click", function(e) {
        if (e.target === drawer) closeDrawer();
      });
      window.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && drawer && drawer.classList.contains("open")) closeDrawer();
      });
      if (copyBtn) copyBtn.addEventListener("click", function() {
        var text = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.textContent = "Copied!";
          setTimeout(function() { copyBtn.textContent = "Copy HTML"; }, 1800);
        });
      });
    })();
  </script>
</body>
</html>
