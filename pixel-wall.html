<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Pixel Pop Wall — Interactive Background Animation</title>
  <meta name="description" content="A high-performance 2D frontal pixel wall background animation where clicking tiles pops them slightly upward with spring physics.">
  <link rel="stylesheet" href="./effects/pixel-wall/styles.css">
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Brand / Title -->
  <header class="top-header">
    <div class="brand-icon">2D</div>
    <div class="title-group">
      <h1>2D Pixel Pop Wall</h1>
      <span class="subtitle">Tactile Pixel Matrix · Click & Hover Pop Engine</span>
    </div>
  </header>

  <!-- Top Actions -->
  <nav class="top-actions">
    <a href="/" class="action-btn">← All Presets</a>
    <a href="./stack-box.html" class="action-btn">3D Stack Box</a>
    <button id="btn-toggle-hud" class="action-btn" title="Toggle HUD Controls (H)">HUD: ON</button>
    <button id="btn-export-code" class="action-btn accent">Export HTML</button>
  </nav>

  <!-- Interactive HUD Controls -->
  <aside class="hud-panel" id="hud-panel">
    <div class="hud-header">
      <h2>Pixel Wall Config</h2>
    </div>

    <!-- Theme Selection -->
    <div class="control-group">
      <label>Color Theme</label>
      <div class="theme-grid">
        <button class="theme-pill active" data-theme="obsidian">Obsidian</button>
        <button class="theme-pill" data-theme="titanium">Titanium</button>
        <button class="theme-pill" data-theme="cyan">Cyan</button>
        <button class="theme-pill" data-theme="amber">Amber</button>
        <button class="theme-pill" data-theme="emerald">Emerald</button>
      </div>
    </div>

    <!-- Click Pop Height -->
    <div class="control-group">
      <label for="slider-click-pop">Click Pop Height <span class="val" id="val-click-pop">14px</span></label>
      <input type="range" id="slider-click-pop" min="4" max="36" value="14" step="1">
    </div>

    <!-- Hover Micro-Lift -->
    <div class="control-group">
      <label for="slider-hover-pop">Hover Micro-Lift <span class="val" id="val-hover-pop">5px</span></label>
      <input type="range" id="slider-hover-pop" min="0" max="15" value="5" step="1">
    </div>

    <!-- Hover Radius -->
    <div class="control-group">
      <label for="slider-radius">Hover Radius <span class="val" id="val-radius">100px</span></label>
      <input type="range" id="slider-radius" min="40" max="250" value="100" step="5">
    </div>

    <!-- Spring Responsiveness -->
    <div class="control-group">
      <label for="slider-spring">Spring Speed <span class="val" id="val-spring">18.0</span></label>
      <input type="range" id="slider-spring" min="6" max="36" value="18" step="0.5">
    </div>

    <!-- Tile Size -->
    <div class="control-group">
      <label for="slider-tile-size">Pixel Tile Size <span class="val" id="val-tile-size">32px</span></label>
      <input type="range" id="slider-tile-size" min="16" max="64" value="32" step="2">
    </div>

    <!-- Bottom Shadow Bevel Reveal Toggle -->
    <div class="toggle-row">
      <span>Bottom Depth Bevel</span>
      <label class="switch">
        <input type="checkbox" id="toggle-bevel" checked>
        <span class="slider-round"></span>
      </label>
    </div>
  </aside>

  <!-- Bottom Info Badge -->
  <div class="info-badge">
    <div class="fps-dot"></div>
    <span id="fps-counter">60 FPS</span>
    <span>·</span>
    <span id="tile-count">0 Pixels</span>
  </div>

  <script type="module">
    import { PixelWallEngine } from './effects/pixel-wall/PixelWall.js';

    const container = document.getElementById('canvas-container');
    const engine = new PixelWallEngine(container, {
      tileSize: 32,
      gap: 3,
      clickPopHeight: 14,
      hoverPopHeight: 5,
      hoverRadius: 100,
      springSpeed: 18.0,
      theme: 'obsidian',
      showBottomBevel: true
    });

    // FPS and Tile Count monitors
    let frameTimes = [];
    const fpsCounter = document.getElementById('fps-counter');
    const tileCounter = document.getElementById('tile-count');

    function updateStats(timestamp) {
      while (frameTimes.length > 0 && frameTimes[0] <= timestamp - 1000) {
        frameTimes.shift();
      }
      frameTimes.push(timestamp);
      if (fpsCounter && frameTimes.length > 1) {
        fpsCounter.textContent = `${frameTimes.length} FPS`;
      }
      if (tileCounter) {
        tileCounter.textContent = `${engine.tiles.length} Pixels`;
      }
      requestAnimationFrame(updateStats);
    }
    requestAnimationFrame(updateStats);

    // Theme selector
    const themePills = document.querySelectorAll('.theme-pill');
    themePills.forEach(pill => {
      pill.addEventListener('click', () => {
        themePills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        engine.setTheme(pill.getAttribute('data-theme'));
      });
    });

    // Range sliders
    function bindSlider(id, valId, unit, optKey, parseFn = parseFloat) {
      const slider = document.getElementById(id);
      const val = document.getElementById(valId);
      if (!slider || !val) return;
      slider.addEventListener('input', (e) => {
        const parsed = parseFn(e.target.value);
        val.textContent = `${parsed}${unit}`;
        engine.setOptions({ [optKey]: parsed });
      });
    }

    bindSlider('slider-click-pop', 'val-click-pop', 'px', 'clickPopHeight');
    bindSlider('slider-hover-pop', 'val-hover-pop', 'px', 'hoverPopHeight');
    bindSlider('slider-radius', 'val-radius', 'px', 'hoverRadius');
    bindSlider('slider-spring', 'val-spring', '', 'springSpeed');

    const tileSizeSlider = document.getElementById('slider-tile-size');
    const tileSizeVal = document.getElementById('val-tile-size');
    tileSizeSlider.addEventListener('input', (e) => {
      const size = parseInt(e.target.value, 10);
      tileSizeVal.textContent = `${size}px`;
      engine.setOptions({ tileSize: size });
    });

    // Switches
    document.getElementById('toggle-bevel').addEventListener('change', (e) => {
      engine.setOptions({ showBottomBevel: e.target.checked });
    });

    // HUD Toggle
    const hudPanel = document.getElementById('hud-panel');
    const btnToggleHud = document.getElementById('btn-toggle-hud');
    function toggleHud() {
      hudPanel.classList.toggle('hidden');
      const isHidden = hudPanel.classList.contains('hidden');
      btnToggleHud.textContent = isHidden ? 'HUD: OFF' : 'HUD: ON';
    }
    btnToggleHud.addEventListener('click', toggleHud);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') toggleHud();
    });

    // Export HTML
    document.getElementById('btn-export-code').addEventListener('click', () => {
      window.open('./pixel-wall-standalone.html', '_blank');
    });
  </script>
</body>
</html>
