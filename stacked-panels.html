<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked-Panel Wave — 3D Isometric Kinetic Field (Standalone)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #000000;
      --panel-bg: rgba(12, 12, 18, 0.78);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-hover: rgba(255, 255, 255, 0.18);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-primary);
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .sp-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 45%, #0d0e14 0%, #000000 100%);
    }

    .sp-canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .sp-topbar {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .sp-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
    }

    .sp-brand-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
    }

    .sp-brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .sp-brand-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sp-topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .sp-action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .sp-action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--panel-border-hover);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .sp-hud-panel {
      position: absolute;
      top: 76px;
      right: 24px;
      width: 290px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      z-index: 20;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sp-hud-panel.collapsed .sp-hud-content {
      display: none;
    }

    .sp-hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--panel-border);
    }

    .sp-hud-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .sp-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .sp-hud-panel.collapsed .sp-toggle-btn {
      transform: rotate(180deg);
    }

    .sp-hud-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .sp-control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sp-control-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .sp-val-badge {
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .sp-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .sp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .sp-palette-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .sp-theme-btn {
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sp-theme-btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transform: scale(1.05);
    }

    .sp-checkbox-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .sp-switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .sp-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .sp-switch-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      transition: 0.25s;
    }

    .sp-switch-slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.25s;
    }

    .sp-switch input:checked + .sp-switch-slider {
      background-color: rgba(255, 255, 255, 0.5);
    }

    .sp-switch input:checked + .sp-switch-slider:before {
      transform: translateX(14px);
    }

    .sp-bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .sp-status-pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="sp-frame">
    <div id="sp-container" class="sp-canvas-container"></div>

    <header class="sp-topbar">
      <div class="sp-brand">
        <svg class="sp-brand-icon" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="sp-brand-title">Stacked-Panel Wave</span>
        <span class="sp-brand-tag">Standalone</span>
      </div>

      <div class="sp-topbar-actions">
        <button id="sp-burst-btn" class="sp-action-btn" title="Trigger Impact Shockwave">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Shockwave</span>
        </button>
        <button id="sp-snapshot-btn" class="sp-action-btn" title="Save PNG Snapshot">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span>Snapshot</span>
        </button>
      </div>
    </header>

    <aside class="sp-hud-panel" id="sp-hud">
      <div class="sp-hud-header" id="sp-hud-header">
        <div class="sp-hud-title">
          <span>✦</span>
          <span>Wave Controls</span>
        </div>
        <button class="sp-toggle-btn" id="sp-toggle" aria-label="Toggle Panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <div class="sp-hud-content">
        <div class="sp-control-group">
          <div class="sp-control-label-row">
            <span>Color Palette</span>
          </div>
          <div class="sp-palette-row">
            <button class="sp-theme-btn active" data-theme="obsidian" style="background: linear-gradient(135deg, #191922, #000000);" title="Obsidian Stealth"></button>
            <button class="sp-theme-btn" data-theme="titanium" style="background: linear-gradient(135deg, #e2e8f0, #2d313d);" title="Titanium Silver"></button>
            <button class="sp-theme-btn" data-theme="cyber-cyan" style="background: linear-gradient(135deg, #00f0ff, #092133);" title="Cyberpunk Cyan"></button>
            <button class="sp-theme-btn" data-theme="amber-glow" style="background: linear-gradient(135deg, #ffb830, #2b1b0b);" title="Amber Monolith"></button>
            <button class="sp-theme-btn" data-theme="emerald-matrix" style="background: linear-gradient(135deg, #00ff88, #0b2616);" title="Emerald Matrix"></button>
          </div>
        </div>

        <div class="sp-control-group">
          <div class="sp-control-label-row">
            <span>Grid Resolution</span>
            <span class="sp-val-badge" id="sp-density-val">30 × 30</span>
          </div>
          <input type="range" id="sp-density-slider" class="sp-slider" min="16" max="44" step="2" value="30">
        </div>

        <div class="sp-control-group">
          <div class="sp-control-label-row">
            <span>Peak Wave Height</span>
            <span class="sp-val-badge" id="sp-height-val">68px</span>
          </div>
          <input type="range" id="sp-height-slider" class="sp-slider" min="20" max="120" step="2" value="68">
        </div>

        <div class="sp-control-group">
          <div class="sp-control-label-row">
            <span>Cursor Wave Radius</span>
            <span class="sp-val-badge" id="sp-radius-val">220px</span>
          </div>
          <input type="range" id="sp-radius-slider" class="sp-slider" min="100" max="360" step="10" value="220">
        </div>

        <div class="sp-control-group">
          <div class="sp-control-label-row">
            <span>Spring Elasticity</span>
            <span class="sp-val-badge" id="sp-spring-val">0.10</span>
          </div>
          <input type="range" id="sp-spring-slider" class="sp-slider" min="0.02" max="0.25" step="0.01" value="0.10">
        </div>

        <div class="sp-checkbox-row">
          <span class="sp-checkbox-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            Rolling Ocean Swells
          </span>
          <label class="sp-switch">
            <input type="checkbox" id="sp-ambient-toggle" checked>
            <span class="sp-switch-slider"></span>
          </label>
        </div>
      </div>
    </aside>

    <footer class="sp-bottom-bar">
      <div class="sp-status-pill" id="sp-fps-text">60 FPS • 900 Monolith Panels • Active</div>
      <div class="sp-status-pill">Hover Cursor to Elevate Wave • Click For Shockwave</div>
    </footer>
  </div>

  <script>
    class StackedPanelsEngine {
      constructor(container, options = {}) {
        this.container = typeof container === 'string' ? document.querySelector(container) : container;
        if (!this.container) throw new Error('Invalid container element');

        this.options = Object.assign({
          gridCols: 30,
          gridRows: 30,
          panelWidth: 16,
          panelDepth: 8,
          panelSpacingX: 6,
          panelSpacingZ: 6,
          baseHeight: 8,
          maxHeight: 68,
          waveRadius: 220,
          springStiffness: 0.10,
          springDamping: 0.86,
          theme: 'obsidian',
          isoAngle: 30,
          outlineWidth: 1.0,
          ambientBreathing: true,
          dprCap: 2
        }, options);

        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.style.display = 'block';
        this.canvas.style.width = '100%';
        this.canvas.style.height = '100%';
        this.container.appendChild(this.canvas);

        this.width = 0;
        this.height = 0;
        this.dpr = 1;
        this.rafId = null;
        this.startTime = performance.now();
        this.lastTime = this.startTime;
        this.isRunning = false;

        this.mouse = {
          screenX: -9999,
          screenY: -9999,
          targetWorldX: -9999,
          targetWorldZ: -9999,
          currentWorldX: -9999,
          currentWorldZ: -9999,
          isHovering: false
        };

        this.shockwaves = [];
        this.panels = [];

        this.handleResize();
        this.initGrid();
        this.bindEvents();
        this.start();
      }

      initGrid() {
        this.panels = [];
        const cols = this.options.gridCols;
        const rows = this.options.gridRows;

        const stepX = this.options.panelWidth + this.options.panelSpacingX;
        const stepZ = this.options.panelDepth + this.options.panelSpacingZ;

        const totalWorldWidth = cols * stepX;
        const totalWorldDepth = rows * stepZ;

        const startX = -totalWorldWidth * 0.5 + stepX * 0.5;
        const startZ = -totalWorldDepth * 0.5 + stepZ * 0.5;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const wx = startX + c * stepX;
            const wz = startZ + r * stepZ;

            this.panels.push({
              col: c,
              row: r,
              wx: wx,
              wz: wz,
              currentH: this.options.baseHeight,
              targetH: this.options.baseHeight,
              velocityH: 0,
              depthOrder: c + r,
              activeFactor: 0
            });
          }
        }

        this.panels.sort((a, b) => a.depthOrder - b.depthOrder);
      }

      getThemePalette(themeName) {
        const t = (themeName || this.options.theme || 'obsidian').toLowerCase();
        if (t.includes('titanium')) {
          return {
            bg: '#000000',
            topFace: '#1a1d26',
            topActive: '#ffffff',
            leftFace: '#0a0c12',
            leftActive: '#363d4e',
            rightFace: '#11141c',
            rightActive: '#555f7a',
            outline: 'rgba(255, 255, 255, 0.14)',
            outlineActive: '#ffffff',
            accent: '#ffffff'
          };
        } else if (t.includes('cyan') || t.includes('cyber')) {
          return {
            bg: '#000000',
            topFace: '#082233',
            topActive: '#00f0ff',
            leftFace: '#020a10',
            leftActive: '#003d52',
            rightFace: '#041420',
            rightActive: '#006688',
            outline: 'rgba(0, 240, 255, 0.14)',
            outlineActive: '#ffffff',
            accent: '#00f0ff'
          };
        } else if (t.includes('amber') || t.includes('gold')) {
          return {
            bg: '#000000',
            topFace: '#241404',
            topActive: '#ffb830',
            leftFace: '#0d0701',
            leftActive: '#522b04',
            rightFace: '#170c02',
            rightActive: '#854606',
            outline: 'rgba(255, 184, 48, 0.14)',
            outlineActive: '#fff3cc',
            accent: '#ffb830'
          };
        } else if (t.includes('emerald') || t.includes('matrix')) {
          return {
            bg: '#000000',
            topFace: '#062412',
            topActive: '#00ff88',
            leftFace: '#020d06',
            leftActive: '#004724',
            rightFace: '#03180c',
            rightActive: '#00733a',
            outline: 'rgba(0, 255, 136, 0.14)',
            outlineActive: '#ccffe6',
            accent: '#00ff88'
          };
        } else {
          return {
            bg: '#000000',
            topFace: '#141720',
            topActive: '#ffffff',
            leftFace: '#06070a',
            leftActive: '#1c202a',
            rightFace: '#0b0e14',
            rightActive: '#2e3444',
            outline: 'rgba(255, 255, 255, 0.12)',
            outlineActive: 'rgba(255, 255, 255, 0.95)',
            accent: '#ffffff'
          };
        }
      }

      project(wx, wy, wz) {
        const rad = (this.options.isoAngle * Math.PI) / 180;
        const cosAngle = Math.cos(rad);
        const sinAngle = Math.sin(rad);

        const screenX = this.width * 0.5 + (wx - wz) * cosAngle;
        const screenY = this.height * 0.52 + (wx + wz) * sinAngle - wy;

        return { x: screenX, y: screenY };
      }

      unprojectGround(sx, sy) {
        const rad = (this.options.isoAngle * Math.PI) / 180;
        const cosAngle = Math.cos(rad);
        const sinAngle = Math.sin(rad);

        const relX = sx - this.width * 0.5;
        const relY = sy - this.height * 0.52;

        const termA = relX / cosAngle;
        const termB = relY / sinAngle;

        const wx = (termA + termB) * 0.5;
        const wz = (termB - termA) * 0.5;

        return { wx, wz };
      }

      bindEvents() {
        this._onResize = () => this.handleResize();
        window.addEventListener('resize', this._onResize);

        const onMove = (clientX, clientY) => {
          const rect = this.canvas.getBoundingClientRect();
          this.mouse.screenX = clientX - rect.left;
          this.mouse.screenY = clientY - rect.top;

          const ground = this.unprojectGround(this.mouse.screenX, this.mouse.screenY);
          this.mouse.targetWorldX = ground.wx;
          this.mouse.targetWorldZ = ground.wz;
          this.mouse.isHovering = true;
        };

        this.canvas.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
        this.canvas.addEventListener('mouseleave', () => {
          this.mouse.isHovering = false;
          this.mouse.targetWorldX = -9999;
          this.mouse.targetWorldZ = -9999;
        });

        this.canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length > 0) {
            onMove(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

        this.canvas.addEventListener('touchend', () => {
          this.mouse.isHovering = false;
        });

        this.canvas.addEventListener('click', (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const ground = this.unprojectGround(e.clientX - rect.left, e.clientY - rect.top);
          this.triggerShockwave(ground.wx, ground.wz);
        });
      }

      triggerShockwave(originWx = 0, originWz = 0) {
        this.shockwaves.push({
          wx: originWx,
          wz: originWz,
          radius: 0,
          maxRadius: Math.max(this.width, this.height) * 0.55,
          speed: 380,
          strength: 1.0,
          decay: 1.2
        });
      }

      handleResize() {
        const rect = this.container.getBoundingClientRect();
        this.width = rect.width || window.innerWidth;
        this.height = rect.height || window.innerHeight;
        this.dpr = Math.min(this.options.dprCap, window.devicePixelRatio || 1);
        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);
      }

      setOption(key, val) {
        if (key === 'gridCols' || key === 'gridRows' || key === 'density') {
          if (key === 'density') {
            const d = parseInt(val, 10);
            this.options.gridCols = d;
            this.options.gridRows = d;
          } else {
            this.options[key] = val;
          }
          this.initGrid();
          return;
        }
        this.options[key] = val;
      }

      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.lastTime = performance.now();

        const loop = (time) => {
          if (!this.isRunning) return;
          const dt = Math.min((time - this.lastTime) / 1000, 0.05);
          this.lastTime = time;

          this.update(dt, (time - this.startTime) / 1000);
          this.render();

          this.rafId = requestAnimationFrame(loop);
        };
        this.rafId = requestAnimationFrame(loop);
      }

      stop() {
        this.isRunning = false;
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
      }

      update(dt, elapsed) {
        if (this.mouse.isHovering) {
          if (this.mouse.currentWorldX === -9999) {
            this.mouse.currentWorldX = this.mouse.targetWorldX;
            this.mouse.currentWorldZ = this.mouse.targetWorldZ;
          } else {
            const mRate = 1.0 - Math.exp(-24.0 * dt);
            this.mouse.currentWorldX += (this.mouse.targetWorldX - this.mouse.currentWorldX) * mRate;
            this.mouse.currentWorldZ += (this.mouse.targetWorldZ - this.mouse.currentWorldZ) * mRate;
          }
        } else {
          this.mouse.currentWorldX += (-9999 - this.mouse.currentWorldX) * (12.0 * dt);
          this.mouse.currentWorldZ += (-9999 - this.mouse.currentWorldZ) * (12.0 * dt);
        }

        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += sw.speed * dt;
          sw.strength -= sw.decay * dt;
          if (sw.strength <= 0 || sw.radius >= sw.maxRadius) {
            this.shockwaves.splice(i, 1);
          }
        }

        const baseH = this.options.baseHeight;
        const maxH = this.options.maxHeight;
        const waveR = this.options.waveRadius;
        const rippleK = 0.045;

        const mx = this.mouse.currentWorldX;
        const mz = this.mouse.currentWorldZ;
        const hasMouse = this.mouse.isHovering && mx > -9000;
        const ambientWave = this.options.ambientBreathing;

        const lerpRate = (hasMouse ? 14.0 : 8.0);
        const springFactor = 1.0 - Math.exp(-lerpRate * dt);

        for (let i = 0, len = this.panels.length; i < len; i++) {
          const p = this.panels[i];
          let targetElevation = 0;

          if (hasMouse) {
            const dx = p.wx - mx;
            const dz = p.wz - mz;
            const dist = Math.hypot(dx, dz);

            if (dist < waveR * 1.6) {
              const normDist = dist / waveR;
              const gaussian = Math.exp(-(normDist * normDist) * 2.2);
              const ripple = Math.cos(dist * rippleK - elapsed * 5.0) * 0.25;
              const combined = Math.max(0, gaussian + ripple * gaussian);
              targetElevation += (maxH - baseH) * combined;
            }
          }

          for (const sw of this.shockwaves) {
            const dx = p.wx - sw.wx;
            const dz = p.wz - sw.wz;
            const dist = Math.hypot(dx, dz);
            const ringDiff = Math.abs(dist - sw.radius);

            if (ringDiff < 55) {
              const ringFactor = (1 - ringDiff / 55) * Math.sin((1 - ringDiff / 55) * Math.PI);
              targetElevation += (maxH * 0.85) * ringFactor * sw.strength;
            }
          }

          // Ambient Rolling Ocean Swells (Multi-frequency Gerstner/Harmonic Waves)
          if (ambientWave) {
            const u = p.wx * 0.007;
            const v = p.wz * 0.007;
            const swell1 = Math.sin(u * 1.4 + v * 1.1 - elapsed * 2.4);
            const swell2 = Math.sin(u * 2.0 - v * 1.6 - elapsed * 1.7) * 0.65;
            const swell3 = Math.cos(u * 0.9 + v * 1.8 + elapsed * 1.2) * 0.45;
            const chop = Math.sin(u * 3.2 + v * 3.2 - elapsed * 3.4) * 0.22;
            const rawWave = swell1 + swell2 + swell3 + chop;
            const crest = Math.sign(rawWave) * Math.pow(Math.abs(rawWave) / 2.3, 1.25) * 2.3;
            const oceanElevation = (crest + 0.6) * 7.5;
            targetElevation += oceanElevation;
          }

          p.targetH = baseH + targetElevation;

          // Ultra-smooth spring easing
          p.currentH += (p.targetH - p.currentH) * springFactor;
          if (p.currentH < 2) p.currentH = 2;
          p.activeFactor = Math.max(0, Math.min(1, (p.currentH - baseH) / Math.max(1, maxH - baseH)));
        }
      }

      render() {
        const ctx = this.ctx;
        const palette = this.getThemePalette(this.options.theme);

        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        ctx.fillStyle = palette.bg;
        ctx.fillRect(0, 0, this.width, this.height);

        const halfW = this.options.panelWidth * 0.5;
        const halfD = this.options.panelDepth * 0.5;
        const outlineW = this.options.outlineWidth;

        const rad = (this.options.isoAngle * Math.PI) / 180;
        const cosA = Math.cos(rad);
        const sinA = Math.sin(rad);
        const centerX = this.width * 0.5;
        const centerY = this.height * 0.52;

        const ox0 = (-halfW + halfD) * cosA;
        const oy0 = (-halfW - halfD) * sinA;
        const ox1 = (halfW + halfD) * cosA;
        const oy1 = (halfW - halfD) * sinA;
        const ox2 = (halfW - halfD) * cosA;
        const oy2 = (halfW + halfD) * sinA;
        const ox3 = (-halfW - halfD) * cosA;
        const oy3 = (-halfW + halfD) * sinA;

        // Render Panels in Depth Order (Back to Front)
        for (let i = 0, len = this.panels.length; i < len; i++) {
          const p = this.panels[i];
          const wx = p.wx;
          const wz = p.wz;
          const h = p.currentH;
          const act = p.activeFactor;

          const scx = centerX + (wx - wz) * cosA;
          const sby = centerY + (wx + wz) * sinA;
          const sty = sby - h;

          const b0x = scx + ox0, b0y = sby + oy0;
          const b1x = scx + ox1, b1y = sby + oy1;
          const b2x = scx + ox2, b2y = sby + oy2;
          const b3x = scx + ox3, b3y = sby + oy3;

          const t0x = scx + ox0, t0y = sty + oy0;
          const t1x = scx + ox1, t1y = sty + oy1;
          const t2x = scx + ox2, t2y = sty + oy2;
          const t3x = scx + ox3, t3y = sty + oy3;

          // Left Face (Secondary Deep Facet)
          ctx.beginPath();
          ctx.moveTo(b3x, b3y);
          ctx.lineTo(b2x, b2y);
          ctx.lineTo(t2x, t2y);
          ctx.lineTo(t3x, t3y);
          ctx.closePath();
          ctx.fillStyle = act > 0.02 ? this.lerpColor(palette.leftFace, palette.leftActive, act) : palette.leftFace;
          ctx.fill();
          ctx.strokeStyle = act > 0.3 ? palette.outlineActive : palette.outline;
          ctx.lineWidth = outlineW;
          ctx.stroke();

          // Right Face (Secondary Midtone Facet)
          ctx.beginPath();
          ctx.moveTo(b2x, b2y);
          ctx.lineTo(b1x, b1y);
          ctx.lineTo(t1x, t1y);
          ctx.lineTo(t2x, t2y);
          ctx.closePath();
          ctx.fillStyle = act > 0.02 ? this.lerpColor(palette.rightFace, palette.rightActive, act) : palette.rightFace;
          ctx.fill();
          ctx.strokeStyle = act > 0.3 ? palette.outlineActive : palette.outline;
          ctx.lineWidth = outlineW;
          ctx.stroke();

          // Top Face (Primary Highlight Cap)
          ctx.beginPath();
          ctx.moveTo(t0x, t0y);
          ctx.lineTo(t1x, t1y);
          ctx.lineTo(t2x, t2y);
          ctx.lineTo(t3x, t3y);
          ctx.closePath();
          ctx.fillStyle = act > 0.04 ? this.lerpColor(palette.topFace, palette.topActive, Math.pow(act, 0.75)) : palette.topFace;
          ctx.fill();
          ctx.strokeStyle = act > 0.25 ? palette.outlineActive : palette.outline;
          ctx.lineWidth = outlineW;
          ctx.stroke();
        }

        ctx.restore();
      }

      lerpColor(hexA, hexB, t) {
        if (t <= 0) return hexA;
        if (t >= 1) return hexB;

        const parse = (hex) => {
          let c = hex.replace('#', '');
          if (c.length === 3) c = c.split('').map(x => x + x).join('');
          const num = parseInt(c, 16);
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        };

        try {
          const [r1, g1, b1] = parse(hexA.startsWith('#') ? hexA : '#191922');
          const [r2, g2, b2] = parse(hexB.startsWith('#') ? hexB : '#f8fafc');
          const r = Math.round(r1 + (r2 - r1) * t);
          const g = Math.round(g1 + (g2 - g1) * t);
          const b = Math.round(b1 + (b2 - b1) * t);
          return `rgb(${r}, ${g}, ${b})`;
        } catch {
          return hexA;
        }
      }

      destroy() {
        this.stop();
        window.removeEventListener('resize', this._onResize);
        if (this.canvas && this.canvas.parentNode) {
          this.canvas.parentNode.removeChild(this.canvas);
        }
      }
    }

    const container = document.getElementById('sp-container');
    const visualizer = new StackedPanelsEngine(container, {
      gridCols: 30,
      gridRows: 30,
      baseHeight: 8,
      maxHeight: 68,
      waveRadius: 220,
      springStiffness: 0.10,
      theme: 'obsidian',
      ambientBreathing: true
    });

    const hud = document.getElementById('sp-hud');
    const hudHeader = document.getElementById('sp-hud-header');
    hudHeader.addEventListener('click', () => {
      hud.classList.toggle('collapsed');
    });

    const themeBtns = document.querySelectorAll('.sp-theme-btn');
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        themeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        visualizer.setOption('theme', btn.dataset.theme);
      });
    });

    const densitySlider = document.getElementById('sp-density-slider');
    const densityVal = document.getElementById('sp-density-val');
    densitySlider.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10);
      densityVal.textContent = `${v} × ${v}`;
      visualizer.setOption('density', v);
    });

    const heightSlider = document.getElementById('sp-height-slider');
    const heightVal = document.getElementById('sp-height-val');
    heightSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      heightVal.textContent = `${v}px`;
      visualizer.setOption('maxHeight', v);
    });

    const radiusSlider = document.getElementById('sp-radius-slider');
    const radiusVal = document.getElementById('sp-radius-val');
    radiusSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      radiusVal.textContent = `${v}px`;
      visualizer.setOption('waveRadius', v);
    });

    const springSlider = document.getElementById('sp-spring-slider');
    const springVal = document.getElementById('sp-spring-val');
    springSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      springVal.textContent = v.toFixed(2);
      visualizer.setOption('springStiffness', v);
    });

    const ambientToggle = document.getElementById('sp-ambient-toggle');
    ambientToggle.addEventListener('change', (e) => {
      visualizer.setOption('ambientBreathing', e.target.checked);
    });

    document.getElementById('sp-burst-btn').addEventListener('click', () => {
      visualizer.triggerShockwave();
    });

    document.getElementById('sp-snapshot-btn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'stacked-panel-wave.png';
      link.href = visualizer.canvas.toDataURL('image/png');
      link.click();
    });

    const fpsText = document.getElementById('sp-fps-text');
    let frameCount = 0;
    let lastFpsCalc = performance.now();
    let currentFps = 60;

    function fpsLoop() {
      frameCount++;
      const now = performance.now();
      if (now - lastFpsCalc >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsCalc = now;
        fpsText.textContent = `${currentFps} FPS • ${visualizer.panels.length} Monolith Panels • Active`;
      }
      requestAnimationFrame(fpsLoop);
    }
    fpsLoop();
  </script>
</body>
</html>
